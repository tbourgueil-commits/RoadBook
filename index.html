<!DOCTYPE html>


<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<title>Road Trip - Carnet de Voyage</title>
<link rel="manifest" href="manifest.json">
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;

        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .setup-screen {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .setup-screen h1 {
            color: #d2691e;
            margin-bottom: 10px;
            text-align: center;
        }

        .setup-screen p {
            color: #666;

            margin-bottom: 30px;
        }

        .form-field {
            margin-bottom: 20px;
        }

        .form-field label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-field input, .form-field select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .date-selector {
            display: flex;
            gap: 10px;
        }

        .date-selector select {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;

        }

        .btn-primary {
            background: #d2691e;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;

        }

        .header {
            background: white;
            padding: 20px;

        .day-selector {

        .edit-day-btn {

        }

        .modal {

        .modal.active {

        .modal-content {

            border-radius: 15px;

        .form-group {

        .user-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

        }

        .menu-btn-cancel {

        }

</head>
<body>
<div class="container">
<div class="setup-screen" id="setupScreen">
<h1>🏜️ Bienvenue !</h1>
<p>Configurez votre carnet de voyage</p>
<div class="form-field">
<label>Votre nom</label>
<input id="setupName" placeholder="Ex: Thomas" type="text"/>
</div>
<div class="form-field">
<label>Votre email</label>
<input id="setupEmail" placeholder="Ex: thomas@example.com" type="email"/>
</div>
<div class="form-field">
<label>Nom du voyage</label>
<input id="setupTripName" placeholder="Ex: Road Trip Maroc 2026" type="text"/>
</div>
<div class="form-field">
<label>Commentaire / Description (optionnel)</label>
<textarea id="setupComment" placeholder="Ex: Voyage en famille à travers le Maroc, montagnes et désert..." style="min-height: 80px; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; width: 100%; resize: vertical;"></textarea>
</div>
<button class="btn-primary" id="startTripBtn" onclick="saveUserConfig()">Commencer mon voyage</button>
</div>
<div class="hidden" id="mainApp">
<div class="header">
<h1 id="headerTripName">Road Trip</h1>
<div class="trip-name" id="headerSubtitle"></div>
<div class="user-info">
<span id="headerUserInfo"></span>
<button class="btn-change-user" onclick="openUserMenu()">⚙️ Profil</button>
</div>
</div>
<div class="day-selector">
<div class="day-buttons" id="dayButtons"></div>
<div class="export-buttons-row">
<button class="export-btn" onclick="exportToPDF()">📄 Générer PDF</button>
<button class="export-btn" onclick="exportBackup()" style="background:#FF5722;">Sauvegarder</button>
</div>
</div>
<button class="add-step-btn" onclick="openStepModal()">+ Ajouter une étape</button>
<div id="stepsContainer"></div>
</div>
</div>
<!-- Modal pour ajouter un jour -->
<div class="modal" id="addDayModal">
<div class="modal-content">
<h2>📅 Nouveau Jour</h2>
<div class="form-group">
<label>Sélectionnez la date</label>
<div class="date-selector">
<select id="daySelect"></select>
<select id="monthSelect"></select>
<select id="yearSelect"></select>
</div>
</div>
<div class="button-group">
<button class="btn-cancel" onclick="closeAddDayModal()">Annuler</button>
<button class="btn-save" onclick="saveNewDay()">Créer</button>
</div>
</div>
</div>
<!-- Modal pour éditer la date d'un jour -->
<div class="modal" id="editDayModal">
<div class="modal-content">
<h2>📅 Modifier la date du Jour <span id="editDayNumber"></span></h2>
<div class="form-group">
<label>Nouvelle date</label>
<div class="date-selector">
<select id="editDaySelect"></select>
<select id="editMonthSelect"></select>
<select id="editYearSelect"></select>
</div>
</div>
<div class="button-group">
<button class="btn-cancel" onclick="closeEditDayModal()">Annuler</button>
<button class="btn-save" onclick="saveEditDay()">Sauvegarder</button>
</div>
</div>
</div>
<!-- Menu utilisateur -->
<div class="user-menu-overlay" id="userMenuOverlay" onclick="closeUserMenu()"></div>
<div class="user-menu" id="userMenu">
<h3>Mon Profil</h3>
<button class="menu-btn menu-btn-edit" onclick="openEditProfileModal()">
            ✏️ Modifier mes informations
        </button>
<button class="menu-btn menu-btn-change" onclick="confirmChangeUser()">
            🔄 Changer d'utilisateur
        </button>
<button class="menu-btn menu-btn-cancel" onclick="closeUserMenu()">
            Annuler
        </button>
</div>
<!-- Modal pour éditer le profil -->
<div class="modal" id="editProfileModal">
<div class="modal-content">
<h2>✏️ Modifier mon profil</h2>
<div class="form-field">
<label>Votre nom</label>
<input id="editProfileName" placeholder="Ex: Thomas" type="text"/>
</div>
<div class="form-field">
<label>Votre email</label>
<input id="editProfileEmail" placeholder="Ex: thomas@example.com" type="email"/>
</div>
<div class="form-field">
<label>Nom du voyage</label>
<input id="editProfileTripName" placeholder="Ex: Road Trip Maroc 2026" type="text"/>
</div>
<div class="form-field">
<label>Commentaire / Description (optionnel)</label>
<textarea id="editProfileComment" placeholder="Ex: Voyage en famille à travers le Maroc..." style="min-height: 80px; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; width: 100%; resize: vertical;"></textarea>
</div>
<div class="button-group">
<button class="btn-cancel" onclick="closeEditProfileModal()">Annuler</button>
<button class="btn-save" onclick="saveEditProfile()">Sauvegarder</button>
</div>
</div>

<!-- Modal pour ajouter une étape -->
<div class="modal" id="stepModal">
<div class="modal-content">
<h2>Nouvelle Étape</h2>
<div class="gps-status" id="gpsStatus">📍 Récupération du GPS...</div>
<div class="form-group">
<label>📸 Photo (optionnelle)</label>
<input accept="image/*" capture="environment" id="photoInput" style="display:none;" type="file"/>
<button class="camera-btn" id="cameraBtn" onclick="openNativeCamera()">
                    📷 Prendre une photo
                </button>
<img class="preview-image" id="photoPreview" style="display:none;"/>
<button class="camera-btn" id="retakeBtn" onclick="retakePhoto()" style="display:none; background:#ff9800;">
                    🔄 Reprendre une photo
                </button>
<button class="camera-btn" id="saveToGalleryBtn" onclick="savePhotoToLibrary(true)" style="display:none; background:#4CAF50;">
                    💾 Sauvegarder dans la photothèque
                </button>
<div id="saveToGalleryStatus" style="display:none; margin-top:8px; font-size:13px; color:#2e7d32;"></div>
</div>
<div class="form-group">
<label>🎙️ Mémo Vocal (optionnel)</label>
<button class="record-btn" id="recordBtn" onclick="toggleRecording()">
<span id="recordText">🎙️ Démarrer l'enregistrement</span>
</button>
<div class="recording-timer" id="recordingTimer" style="display:none;">⏱️ 00:00</div>
<audio class="audio-player" controls="" id="audioPreview" style="display:none;"></audio>
</div>
<div class="form-group">
<label>💬 Commentaire (optionnel)</label>
<textarea id="commentInput" placeholder="Ajoutez un commentaire..."></textarea>
</div>
<div class="button-group">
<button class="btn-cancel" onclick="closeStepModal()">Annuler</button>
<button class="btn-save" onclick="saveStep()">Sauvegarder</button>
</div>
</div>
</div>
<script>
let currentUser = null;
        let currentDay = 1;
        let currentGPS = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let currentAudioBlob = null;
        let currentPhotoBlob = null;
                let photoSavedToDevice = false;
let recordingInterval = null;
        let recordingStartTime = 0;

        document.addEventListener('DOMContentLoaded', function() {
            loadUserConfig();
            populateDateSelectors();

            // Mode hors-ligne (PWA)
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            }
            
            // Ajouter l'événement onchange au photoInput
            document.getElementById('photoInput').addEventListener('change', handlePhotoCapture);
        });

        function populateDateSelectors() {
            const today = new Date();
            
            // Fonction helper pour remplir les sélecteurs
            function fillSelectors(dayId, monthId, yearId, selectedDate = today) {
                // Jours
                const daySelect = document.getElementById(dayId);
                daySelect.innerHTML = '';
                for (let i = 1; i <= 31; i++) {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = i;
                    if (i === selectedDate.getDate()) option.selected = true;
                    daySelect.appendChild(option);
                }
                
                // Mois
                const monthSelect = document.getElementById(monthId);
                monthSelect.innerHTML = '';
                const months = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 
                              'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
                months.forEach((month, index) => {
                    const option = document.createElement('option');
                    option.value = index + 1;
                    option.textContent = month;
                    if (index === selectedDate.getMonth()) option.selected = true;
                    monthSelect.appendChild(option);
                });
                
                // Années
                const yearSelect = document.getElementById(yearId);
                yearSelect.innerHTML = '';
                for (let i = today.getFullYear() - 1; i <= today.getFullYear() + 2; i++) {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = i;
                    if (i === selectedDate.getFullYear()) option.selected = true;
                    yearSelect.appendChild(option);
                }
            }
            
            // Remplir les sélecteurs pour ajouter un jour
            fillSelectors('daySelect', 'monthSelect', 'yearSelect', today);
            
            // Remplir les sélecteurs pour éditer un jour
            fillSelectors('editDaySelect', 'editMonthSelect', 'editYearSelect', today);
        }

        function loadUserConfig() {
            const storedUser = localStorage.getItem('currentUser');
            if (storedUser) {
                currentUser = JSON.parse(storedUser);
                showMainApp();
            } else {
                showSetupScreen();
            }
        }

        async function saveUserConfig() {
            try {
                const name = document.getElementById('setupName').value.trim();
                const email = document.getElementById('setupEmail').value.trim();
                const tripName = document.getElementById('setupTripName').value.trim();
                const comment = document.getElementById('setupComment').value.trim();

                if (!name || !email || !tripName) {

let tripData = null;
const DB_NAME = 'roadtrip_offline_db';
const DB_VERSION = 1;

function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('tripData')) {
                db.createObjectStore('tripData', { keyPath: 'userId' });
            }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

async function idbGetTripData(userId) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction('tripData', 'readonly');
        const req = tx.objectStore('tripData').get(userId);
        req.onsuccess = () => resolve(req.result ? req.result.data : null);
        req.onerror = () => reject(req.error);
    });
}

async function idbSetTripData(userId, data) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction('tripData', 'readwrite');
        tx.objectStore('tripData').put({ userId, data });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}

function createInitialData() {
    const today = new Date();
    const dateStr = today.toISOString().split('T')[0];
    return {
        userId: currentUser.id,
        days: [{ day: 1, date: dateStr, steps: [] }]
    };
}

function attachMediaUrls() {
    if (!tripData) return;
    for (const day of tripData.days || []) {
        for (const step of day.steps || []) {
            if (step.photoBlob && !step.photoUrl) {
                try { step.photoUrl = URL.createObjectURL(step.photoBlob); } catch {}
            }
            if (step.audioBlob && !step.audioUrl) {
                try { step.audioUrl = URL.createObjectURL(step.audioBlob); } catch {}
            }
        }
    }
}

function revokeMediaUrls() {
    if (!tripData) return;
    for (const day of tripData.days || []) {
        for (const step of day.steps || []) {
            if (step.photoUrl) { try { URL.revokeObjectURL(step.photoUrl); } catch {} step.photoUrl = null; }
            if (step.audioUrl) { try { URL.revokeObjectURL(step.audioUrl); } catch {} step.audioUrl = null; }
        }
    }
}

window.addEventListener('beforeunload', revokeMediaUrls);

    // Compat : conserve le nom de fonction, mais IndexedDB remplace localStorage.
    if (!currentUser) return;

        tripData = createInitialData();
        await idbSetTripData(currentUser.id, tripData);
    } else {
        tripData = stored;
    }
    attachMediaUrls();
}

        // ===== Sauvegarde dans la photothèque (meilleure-effort) =====
        // Note: Sur une web-app (Safari/Chrome), JavaScript n’a pas un accès direct garanti à l’app Photos.
        // On fait donc au mieux:
        // 1) Web Share API (si supportée) pour "Enregistrer l’image" / partager vers Photos
        // 2) Téléchargement du fichier (souvent vers Fichiers sur iOS)
        
        // Réduire/comprimer les photos avant stockage (évite les erreurs de quota localStorage et améliore la fiabilité)
        function compressImageFileToDataURL(file, maxWidth = 1280, quality = 0.82) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('Lecture du fichier photo impossible.'));
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('Chargement de l’image impossible.'));
                    img.onload = () => {
                        try {
                            const scale = Math.min(1, maxWidth / img.width);
                            const w = Math.round(img.width * scale);
                            const h = Math.round(img.height * scale);

                            const canvas = document.createElement('canvas');
                            canvas.width = w;
                            canvas.height = h;

                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);

                            // Toujours en JPEG pour réduire la taille
                            const dataUrl = canvas.toDataURL('image/jpeg', quality);
                            resolve(dataUrl);
                        } catch (e) {
                            reject(e);
                        }
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

function dataURLToBlob(dataUrl) {
            const parts = dataUrl.split(',');
            const mimeMatch = parts[0].match(/data:(.*?);base64/);
            const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
            const binary = atob(parts[1] || '');
            const len = binary.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
            return new Blob([bytes], { type: mime });
        }

        async function savePhotoToLibrary(openShare = true) {
            try {
                if (!currentPhotoBlob) {
                    alert('Aucune photo à sauvegarder.');
                    return;
                }

                const status = document.getElementById('saveToGalleryStatus');
                const blob = (currentPhotoBlob instanceof Blob) ? currentPhotoBlob : dataURLToBlob(currentPhotoBlob);

                // Nom de fichier lisible
                const ts = new Date().toISOString().replace(/[:.]/g, '-');
                const ext = (blob.type && blob.type.includes('png')) ? 'png' : 'jpg';
                const filename = `roadtrip_${ts}.${ext}`;

                // 1) Web Share (meilleure option sur mobile, mais nécessite un geste utilisateur)
                if (openShare && navigator.share && navigator.canShare) {
                    const file = new File([blob], filename, { type: blob.type || 'image/jpeg' });
                    if (navigator.canShare({ files: [file] })) {
                        if (status) {
                            status.style.display = 'block';
                            status.style.color = '#2e7d32';
                            status.textContent = 'Ouverture du partage… choisissez "Enregistrer l’image" / Photos.';
                        }
                        await navigator.share({
                            files: [file],
                            title: 'Photo Road Trip',
                            text: 'Enregistrer cette photo dans Photos'
                        });
                        photoSavedToDevice = true;
                        if (status) status.textContent = '✅ Partage terminé (si vous avez choisi Photos, la photo est enregistrée).';
                        return;
                    }
                }

                // 2) Fallback: téléchargement du fichier
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                photoSavedToDevice = true;
                if (status) {
                    status.style.display = 'block';
                    status.style.color = '#2e7d32';
                    status.textContent = '✅ Photo téléchargée. Sur iPhone, elle peut aller dans l’app Fichiers (selon le navigateur).';
                }
            } catch (err) {
                const status = document.getElementById('saveToGalleryStatus');
                if (status) {
                    status.style.display = 'block';
                    status.style.color = '#c62828';
                    status.textContent = '⚠️ Sauvegarde impossible automatiquement. Essayez le bouton de partage ou utilisez "Partager" depuis l’aperçu.';
                }
                // console.error(err);
            }
        }

        async function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            const text = document.getElementById('recordText');
            const timer = document.getElementById('recordingTimer');

            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const constraints = { audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 44100 } };
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    
                    let options = { mimeType: 'audio/mp4' };
                    if (!MediaRecorder.isTypeSupported('audio/mp4')) {
                        options = { mimeType: 'audio/webm' };
                        if (!MediaRecorder.isTypeSupported('audio/webm')) {
                            options = {};
                        }
                    }
                    
                    mediaRecorder = new MediaRecorder(stream, options);
                    mediaRecorder.stream = stream;
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = () => {
                        const mimeType = mediaRecorder.mimeType || 'audio/webm';
                        const audioBlob = new Blob(audioChunks, { type: mimeType });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        
                        currentAudioBlob = audioBlob;
                            const preview = document.getElementById('audioPreview');
                            preview.src = audioUrl;
                            preview.style.display = 'block';

                        stream.getTracks().forEach(track => track.stop());
                        if (recordingInterval) clearInterval(recordingInterval);
                        timer.style.display = 'none';
                    };

                    mediaRecorder.start();
                    btn.classList.add('recording');
                    text.textContent = '⏹️ Arrêter l\'enregistrement';
                    
                    recordingStartTime = Date.now();
                    timer.style.display = 'block';
                    updateTimer();
                    recordingInterval = setInterval(updateTimer, 1000);
                    
                } catch (error) {
                    alert('Impossible d\'accéder au microphone.');
                }
            } else {
                mediaRecorder.stop();
                btn.classList.remove('recording');
                text.textContent = '🎙️ Démarrer l\'enregistrement';
            }
        }

        async function saveStep() {
            const comment = document.getElementById('commentInput').value.trim();
            
            if (!currentPhotoBlob && !currentAudioBlob && !comment) {
                alert('Veuillez ajouter au moins une photo, un mémo vocal ou un commentaire');
                return;
            }

            // Tente de sauvegarder la photo sur l'appareil (sans ouvrir le partage automatiquement)
            if (currentPhotoBlob && !photoSavedToDevice) {
                // Best effort: téléchargement (souvent vers "Fichiers" sur iOS)
                savePhotoToLibrary(false);
            }

            const data = getData();
            const dayData = data.days.find(d => d.day === currentDay);
            
            const step = {
                id: Date.now() + Math.random(),
                timestamp: new Date().toISOString(),
                photoBlob: currentPhotoBlob,
                audioBlob: currentAudioBlob,
                comment: comment,
                gps: currentGPS
            };

            // URLs d'aperçu (non persistées)
            if (step.photoBlob) { try { step.photoUrl = URL.createObjectURL(step.photoBlob); } catch {} }
            if (step.audioBlob) { try { step.audioUrl = URL.createObjectURL(step.audioBlob); } catch {} }

            dayData.steps.push(step);

            try {
                saveData(data);
            } catch (e) {
                // Annuler l'ajout si on ne peut pas sauvegarder
                dayData.steps.pop();
                alert(e.message || 'Impossible de sauvegarder cette étape (stockage plein).');
                return;
            }

            closeStepModal();
            renderSteps();
            renderDays(); // Rafraîchir les jours pour mettre à jour la mini photo
        }

        function renderSteps() {
            const data = getData();
            const dayData = data.days.find(d => d.day === currentDay);
            const container = document.getElementById('stepsContainer');
            
            if (!dayData || dayData.steps.length === 0) {
                container.innerHTML = '<div class="empty-state">Aucune étape pour ce jour.<br>Commencez à documenter votre voyage !</div>';
                return;
            }

            container.innerHTML = dayData.steps.map(step => {
                const date = new Date(step.timestamp);
                const timeStr = date.toLocaleString('fr-FR', { hour: '2-digit', minute: '2-digit' });

                return `
                    <div class="step-card">
                        <div class="step-header">
                            <div class="step-time">🕐 ${timeStr}</div>
                            <button class="delete-btn" onclick="deleteStep(${step.id})">Supprimer</button>
                        </div>
                        ${step.photoUrl ? `<img src="${step.photoUrl}" class="step-photo" alt="Photo">` : ''}
                        ${step.audioUrl ? `<audio src="${step.audioUrl}" class="audio-player" controls></audio>` : ''}
                        ${step.comment ? `<div class="step-comment">${step.comment}</div>` : ''}
                        ${step.gps ? `<div class="step-gps">📍 <a href="https://www.google.com/maps?q=${step.gps.lat},${step.gps.lng}" target="_blank">C'était ici</a></div>` : ''}
                    </div>
                `;
            }).join('');
        }

        async function deleteStep(stepId) {
            if (!confirm('Supprimer cette étape ?')) return;
            
            const data = getData();
            const dayData = data.days.find(d => d.day === currentDay);
            dayData.steps = dayData.steps.filter(s => s.id !== stepId);
            saveData(data);
            renderSteps();
            renderDays(); // Rafraîchir les jours pour mettre à jour la mini photo
        }

        async function exportToPDF() {
    const data = getData();

    // Convertit un Blob en DataURL (pour pouvoir l'intégrer dans un HTML exporté)
    const blobToDataURL = (blob) => new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onloadend = () => resolve(r.result);
        r.onerror = () => reject(r.error);
        r.readAsDataURL(blob);
    });

    let html = `<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>${currentUser.tripName}</title>
    <style>
        @page { margin: 2cm; }
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        h1 { color: #d2691e; border-bottom: 3px solid #d2691e; padding-bottom: 10px; }
        .user-info { color: #666; font-size: 14px; margin-bottom: 10px; }
        .user-comment { background: #f5deb3; padding: 15px; border-radius: 8px; margin-bottom: 30px; font-style: italic; }
        .day { margin-bottom: 40px; page-break-inside: avoid; }
        .day-header { background: #d2691e; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .day-title { margin: 0; font-size: 24px; }
        .day-date { margin: 5px 0 0 0; opacity: 0.9; }
        .step { border-left: 4px solid #d2691e; padding-left: 20px; margin-bottom: 25px; page-break-inside: avoid; }
        .step-time { font-weight: bold; color: #d2691e; margin-bottom: 8px; }
        .step-photo { max-width: 100%; height: auto; border-radius: 8px; margin: 10px 0; }
        .step-comment { background: #f9f9f9; padding: 10px; border-radius: 5px; margin: 10px 0; }
        .step-audio-note { background: #fff3e0; padding: 10px; border-radius: 5px; margin: 10px 0; color: #ff9800; }
        .step-gps { background: #e8f5e9; padding: 10px; border-radius: 5px; margin: 10px 0; }
        .step-gps a { color: #0066cc; text-decoration: none; font-weight: bold; }
        .no-steps { color: #999; font-style: italic; padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <h1>🏜️ ${currentUser.tripName}</h1>
    <div class="user-info">Carnet de voyage de ${currentUser.name} (${currentUser.email})</div>
    ${currentUser.comment ? `<div class="user-comment">${currentUser.comment}</div>` : ''}
`;

    for (const day of data.days) {
        const dateFormatted = new Date(day.date + 'T00:00:00').toLocaleDateString('fr-FR', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        html += `
    <div class="day">
        <div class="day-header">
            <h2 class="day-title">Jour ${day.day}</h2>
            <div class="day-date">${dateFormatted}</div>
        </div>
`;

        if (!day.steps || day.steps.length === 0) {
            html += `<div class="no-steps">Aucune étape pour ce jour</div>`;
        } else {
            for (const step of day.steps) {
                const stepTime = new Date(step.timestamp).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                html += `<div class="step"><div class="step-time">🕐 ${stepTime}</div>`;

                if (step.photoBlob) {
                    try {
                        const photoDataUrl = await blobToDataURL(step.photoBlob);
                        html += `<img src="${photoDataUrl}" class="step-photo" alt="Photo de l'étape">`;
                    } catch {
                        html += `<div class="step-audio-note">📷 Photo non exportable</div>`;
                    }
                }

                if (step.audioBlob) {
                    html += `<div class="step-audio-note">🎙️ Mémo vocal enregistré pour cette étape</div>`;
                }

                if (step.comment) {
                    html += `<div class="step-comment">${step.comment}</div>`;
                }

                if (step.gps) {
                    html += `<div class="step-gps">📍 <a href="https://www.google.com/maps?q=${step.gps.lat},${step.gps.lng}" target="_blank">C'était ici</a></div>`;
                }

                html += `</div>`;
            }
        }

        html += `</div>`;
    }

    html += `
</body>
</html>`;

    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${currentUser.tripName.replace(/[^a-z0-9]/gi, '_')}_carnet.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    alert('Fichier HTML téléchargé ! Ouvrez-le et utilisez "Imprimer > Enregistrer en PDF" sur votre ordinateur.');
}

        function exportBackup() {
            const allData = {
                user: currentUser,
                tripData: getData(),
                exportDate: new Date().toISOString()
            };
            const dataStr = JSON.stringify(allData);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_${currentUser.tripName.replace(/\s/g, '_')}_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert('Sauvegarde téléchargée ! Conservez ce fichier précieusement.');
        }
    

        // S'assure que le bouton fonctionne même si les handlers inline sont bloqués
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('startTripBtn');
            if (btn) {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    saveUserConfig();
                });
            }
        });
</script>
</body>
</html>
